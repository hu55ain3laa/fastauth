version: 2

# FastAuth signs tokens and hashes passwords, so a vulnerability in a
# dependency reaches every application using it. These updates are the early
# warning: python-jose was removed in 0.4.0 for being unmaintained, and this is
# what surfaces that kind of problem before it becomes a security advisory.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
    groups:
      # Routine updates arrive as one reviewable PR rather than five.
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Pinned action versions go stale too, and a stale action is a supply-chain
  # surface of its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
