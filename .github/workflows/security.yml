name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a CVE published against an unchanged dependency is still
    # found. Most vulnerabilities arrive without anyone touching the code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # Includes the security-focused queries beyond the default set.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audits the project's own dependency tree rather than the environment.
      # Auditing the environment also reports the runner's build tooling — pip
      # itself has advisories — which users never inherit from installing
      # fastauth_iq, so those findings are noise that would train us to ignore
      # this job. Passing the project path scopes it to what users actually get.
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --strict --progress-spinner off .

  npm-audit:
    name: Docs dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The docs site is a static build, so a vulnerable dev dependency is a
      # build-time risk rather than a user-facing one. High and above only,
      # to keep the signal worth reading.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high

  # External links rot silently: jwt.io, Alembic and the FastAPI docs are all
  # linked from the guides. Weekly and advisory, since a third-party site being
  # briefly down should never fail a build.
  links:
    name: External links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check external links in the docs
        run: |
          grep -rhoE 'https?://[a-zA-Z0-9./_#?=-]+' web/app README.md \
            | sed 's/[.,)]*$//' \
            | grep -vE 'localhost|127\.0\.0\.1|example\.com|yourapp\.com|your-domain' \
            | sort -u > /tmp/urls.txt
          echo "Checking $(wc -l < /tmp/urls.txt) distinct URLs"
          fails=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 \
                     -A "fastauth-link-check" "$url" 2>/dev/null || echo 000)
            case "$code" in
              2*|3*) ;;
              403|405|429) echo "  skip $code $url  (bot protection)" ;;
              *) echo "::warning::Dead link $code $url"; fails=$((fails+1)) ;;
            esac
          done < /tmp/urls.txt
          echo "$fails link(s) need attention"
