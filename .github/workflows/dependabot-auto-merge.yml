name: Dependabot auto-merge

# Merges patch and minor dependency updates once every check has passed.
# Major updates are never merged automatically.
#
# This deliberately does not use `gh pr merge --auto`, which would require
# branch protection on main to have anything to wait for. Protecting main
# would also block release.yml from pushing the version bump, since the
# Actions bot is not an administrator. Verifying the checks here instead
# keeps main open and leaves nothing to configure.
#
# Runs on workflow_run rather than pull_request for two reasons: Dependabot
# pull requests get a read-only token on pull_request, and by the time a
# workflow_run fires the checks have results worth reading. Nothing from the
# pull request is ever checked out or executed here; this job only calls the
# API, so the elevated token is not exposed to branch contents.
on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Whichever workflow finishes last is the one that finds everything green
    # and merges. Earlier finishers exit quietly at the "all checks" gate.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                 --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$pr" ]; then
            echo "No pull request for $SHA; nothing to do."
            exit 0
          fi

          title=$(gh pr view "$pr" --repo "$REPO" --json title --jq .title)
          state=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)
          echo "PR #$pr: $title"

          if [ "$state" != "OPEN" ]; then
            echo "Already $state; nothing to do."
            exit 0
          fi

          # Grouped pull requests have no single version pair in the title.
          # The groups in dependabot.yml are declared as
          # `update-types: [minor, patch]`, so membership alone proves no
          # major is included. Any other unparseable title is left alone.
          if printf '%s' "$title" | grep -q -- "-minor-and-patch group"; then
            echo "Grouped minor/patch update; safe by the group's own definition."
            from="group"; to="group"
          else
            # Dependabot titles read "... from <old> to <new>". Comparing the
            # leading number tells us whether this is a major bump without
            # needing the metadata action, which workflow_run cannot use.
            from=$(printf '%s' "$title" | sed -n 's/.* from \([0-9][^ ]*\) to .*/\1/p')
            to=$(printf '%s'   "$title" | sed -n 's/.* to \([0-9][^ ]*\).*/\1/p')
            if [ -z "$from" ] || [ -z "$to" ]; then
              echo "::warning::Could not read versions from '$title'. Leaving this for a human."
              exit 0
            fi
          fi

          if [ "${from%%.*}" != "${to%%.*}" ]; then
            echo "Major update ($from -> $to). Never merged automatically."
            gh pr edit "$pr" --repo "$REPO" --add-label "major-update" || true
            marker="held-for-review-comment"
            if ! gh pr view "$pr" --repo "$REPO" --json comments \
                   --jq '.comments[].body' | grep -q "$marker"; then
              gh pr comment "$pr" --repo "$REPO" --body "$(cat <<EOF
          Held for review: this is a **major** update ($from to $to), so it is not merged automatically.

          Worth checking before merging:

          - Does something else have to move with it? Paired actions such as \`upload-artifact\` and \`download-artifact\` must share a major version.
          - Does the changelog mention removed inputs, dropped runtimes, or changed defaults?
          - Is the action or package deprecated in favour of a successor?

          Green CI is necessary but not sufficient. Some breakage only appears during a real release.

          <!-- $marker -->
          EOF
              )"
            fi
            exit 0
          fi

          # Every check on this commit must have finished, and finished well.
          # Anything still running means another workflow will fire this job
          # again later, so exiting now is safe rather than premature.
          checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv')

          if [ -z "$checks" ]; then
            echo "No checks reported yet; waiting for a later run."
            exit 0
          fi

          echo "$checks" | while IFS=$'\t' read -r name status conclusion; do
            printf '  %-34s %-12s %s\n' "$name" "$status" "$conclusion"
          done

          pending=$(echo "$checks" | awk -F'\t' '$2 != "completed"' | wc -l | tr -d ' ')
          if [ "$pending" -gt 0 ]; then
            echo "$pending check(s) still running. A later workflow_run will retry."
            exit 0
          fi

          # skipped and neutral are fine: External links only runs on a schedule.
          bad=$(echo "$checks" \
                | awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral" { print $1 }')
          if [ -n "$bad" ]; then
            echo "Not merging. These checks did not pass:"
            echo "$bad" | sed 's/^/  /'
            exit 0
          fi

          echo "All checks passed and this is a $from -> $to update. Merging."
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
