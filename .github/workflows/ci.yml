name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing in CI writes to the repository. Without this, jobs
# inherit whatever the repository default is, which may include write scopes.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # A ratchet, not a target. The threshold sits just below current coverage so
  # it catches a real drop without failing on rounding.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -q --cov --cov-report=term-missing --cov-fail-under=78

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo "### Coverage"
            echo ""
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The version is written in four files and the domain in five. Catching a
  # mismatch here is far cheaper than catching it after a tag is pushed.
  consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog check below diffs against the base branch,
      # and a three-dot diff needs a merge base that a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions, changelog and domains
        run: python scripts/check_release.py

      # The changelog is the input the whole release pipeline runs on: it
      # decides the version bump and becomes the release notes. A library
      # change with no entry means a release that cannot describe itself.
      #
      # This is advisory only, so every branch is defensive: it must never be
      # the reason a pull request goes red. Dependency bumps are skipped since
      # they are not user-facing library changes.
      - name: Warn when library changes have no changelog entry
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true

          changed=$(git diff --name-only "$base...HEAD" 2>/dev/null \
                 || git diff --name-only "$base" HEAD 2>/dev/null \
                 || echo "")

          if [ -z "$changed" ]; then
            echo "Could not determine changed files; skipping the changelog check."
            exit 0
          fi

          if echo "$changed" | grep -q '^fastauth/' && \
             ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
            echo "::warning::This changes fastauth/ but not CHANGELOG.md. Add an entry under [Unreleased] unless the change is invisible to users."
          else
            echo "Changelog check: nothing to flag"
          fi

  # Without this a broken docs build only appears on Vercel after merge.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check internal documentation links resolve
        run: |
          # Every /docs/... link in the MDX must correspond to a real page.
          missing=0
          grep -rhoE '\]\(/docs[a-zA-Z0-9/_-]*\)' app \
            | grep -oE '/docs[a-zA-Z0-9/_-]*' \
            | sort -u \
            > /tmp/links.txt
          while read -r link; do
            [ -z "$link" ] && continue
            if [ "$link" = "/docs" ]; then
              target="app/docs/page.mdx"
            else
              target="app${link}/page.mdx"
            fi
            if [ ! -f "$target" ]; then
              echo "::error::Broken docs link $link (no $target)"
              missing=1
            fi
          done < /tmp/links.txt
          [ "$missing" = 0 ] && echo "All $(wc -l < /tmp/links.txt) internal docs links resolve"
          exit $missing
