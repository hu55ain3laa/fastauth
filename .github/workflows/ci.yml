name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # A ratchet, not a target. The threshold sits just below current coverage so
  # it catches a real drop without failing on rounding.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -q --cov --cov-report=term-missing --cov-fail-under=78

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo "### Coverage"
            echo ""
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The version is written in four files and the domain in five. Catching a
  # mismatch here is far cheaper than catching it after a tag is pushed.
  consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions, changelog and domains
        run: python scripts/check_release.py

      # The changelog is the input the whole release pipeline runs on: it
      # decides the version bump and becomes the release notes. A library
      # change with no entry means a release that cannot describe itself.
      - name: Warn when library changes have no changelog entry
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          touches_lib=$(echo "$changed" | grep -c '^fastauth/' || true)
          touches_log=$(echo "$changed" | grep -c '^CHANGELOG.md$' || true)
          if [ "$touches_lib" -gt 0 ] && [ "$touches_log" -eq 0 ]; then
            echo "::warning::This changes fastauth/ but not CHANGELOG.md. Add an entry under [Unreleased] unless the change is invisible to users."
          else
            echo "Changelog check: nothing to flag"
          fi

  # Without this a broken docs build only appears on Vercel after merge.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Check internal documentation links resolve
        run: |
          # Every /docs/... link in the MDX must correspond to a real page.
          missing=0
          grep -rhoE '\]\(/docs[a-zA-Z0-9/_-]*\)' app \
            | grep -oE '/docs[a-zA-Z0-9/_-]*' \
            | sort -u \
            > /tmp/links.txt
          while read -r link; do
            [ -z "$link" ] && continue
            if [ "$link" = "/docs" ]; then
              target="app/docs/page.mdx"
            else
              target="app${link}/page.mdx"
            fi
            if [ ! -f "$target" ]; then
              echo "::error::Broken docs link $link (no $target)"
              missing=1
            fi
          done < /tmp/links.txt
          [ "$missing" = 0 ] && echo "All $(wc -l < /tmp/links.txt) internal docs links resolve"
          exit $missing
