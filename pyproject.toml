[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastauth_iq"
version = "0.8.1"
description = "A comprehensive authentication and authorization library for FastAPI with JWT, cookie support, role-based access control, and automatic database initialization"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Hussein Ghadhban", email = "ala.1995@yahoo.com" },
]
keywords = [
    "fastapi",
    "authentication",
    "authorization",
    "rbac",
    "role-based",
    "jwt",
    "oauth2",
    "sqlmodel",
    "token",
    "cli",
    "database-initialization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = [
    "fastapi>=0.104.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.5",
    "bcrypt>=4.0",
    "pyjwt>=2.6.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
]

[project.scripts]
fastauth = "fastauth.cli:main"

[project.urls]
Homepage = "https://github.com/hu55ain3laa/fastauth"
Documentation = "https://fastauth.pythowner.com"
Source = "https://github.com/hu55ain3laa/fastauth"
"Bug Reports" = "https://github.com/hu55ain3laa/fastauth/issues"

[tool.setuptools.packages.find]
include = ["fastauth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation warnings from our own code should be visible while developing;
# the deprecation tests assert on them explicitly.
filterwarnings = [
    "default::DeprecationWarning:fastauth.*",
]

[tool.coverage.run]
source = ["fastauth"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Auth code paths are the ones worth knowing about, so show which lines are
# untested rather than only a percentage.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
